url: "https://amgcube.com"
baseurl: ""

# Site settings
title: "AMGCUBE | Granny Flat Builder Brisbane"
description: "AMGCUBE is a Brisbane-based licensed builder focused on practical, well-planned granny flats."

company:
  legal_name: "AMGCUBE PTY LTD"
  phone: "+61 458 533 333"
  email: "info@amgcube.com"
  display_home: "146 Dowding St, Oxley"
  location: "Brisbane, Queensland"
  qbcc_licence_number: "15616213"
  qbcc_licence_class: "Builder – Low Rise"

# Social networks usernames
social:
  - title: twitter
    url: https://twitter.com/amgcube
  

# Postal address (optional, remove if not needed)
address:
  - line: 9 Falcon Ave, Thornlands
  - line: Brisbane, QLD 4164

# Build settings
markdown: kramdown
permalink: pretty

# Additional configurations
wdm:
  force_polling: false
logger: true
timezone: Australia/Brisbane
cache: true

include:
  - _pages

# Repository-only maintenance templates; never publish these files with the site.
exclude:
  - templates

collections:
  posts:
    output: true
    permalink: /:path/
  faqs:
    output: true
