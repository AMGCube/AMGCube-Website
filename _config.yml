url: "https://amgcube.com"
baseurl: ""

# Site settings
title: "AMGCUBE | Granny Flat Builder Brisbane"
description: "AMGCUBE is a QBCC-licensed granny flat builder in Brisbane and South East Queensland — designed and built from $250k, 60-100m2, QBCC 15616213, with a display home in Oxley."

company:
  legal_name: "AMGCUBE PTY LTD"
  phone: "+61 458 533 333"
  email: "info@amgcube.com"
  display_home: "146 Dowding St, Oxley"
  location: "Brisbane, Queensland"
  qbcc_licence_number: "15616213"
  qbcc_licence_class: "Builder – Low Rise"

# Social networks usernames
social:
  - title: twitter
    url: https://twitter.com/amgcube
  

# Postal address (optional, remove if not needed)
address:
  - line: 9 Falcon Ave, Thornlands
  - line: Brisbane, QLD 4164

# Build settings
markdown: kramdown
permalink: pretty

# Additional configurations
wdm:
  force_polling: false
logger: true
timezone: Australia/Brisbane
cache: true

include:
  - _pages

# Repository-only maintenance files; never publish these with the site.
# AGENTS.md contains Liquid template syntax that would otherwise break the build.
exclude:
  - templates
  - AGENTS.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - LICENSE

collections:
  posts:
    output: true
    permalink: /:path/
  projects:
    output: true
    permalink: /projects/:name/
  faqs:
    output: true
  guides:
    output: true
    permalink: /guides/:title/
