  <meta charset="utf-8">
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net;
  font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
  script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://code.jquery.com;
  img-src 'self' data:;">

  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <!-- Open Graph -->
  <meta property="og:site_name" content="{{ site.company.legal_name }}">
  <meta property="og:type" content="{{ page.og_type | default: 'website' }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <meta property="og:image" content="{{ page.og_image | default: '/img/og/og-default.webp' | prepend: site.baseurl | prepend: site.url }}">
  <meta property="og:locale" content="en_AU">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
  <meta name="twitter:image" content="{{ page.og_image | default: '/img/og/og-default.webp' | prepend: site.baseurl | prepend: site.url }}">

  <!-- Structured data: Local business -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "{{ site.company.legal_name }}",
    "alternateName": "AMGCUBE",
    "description": "{{ site.description | escape }}",
    "url": "{{ site.url }}/",
    "image": "{{ site.url }}/img/og/og-default.webp",
    "logo": "{{ site.url }}/img/about/logo-title.png",
    "telephone": "+61 458 533 333",
    "priceRange": "$$$",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Brisbane",
      "addressRegion": "QLD",
      "addressCountry": "AU"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": "-27.4705",
      "longitude": "153.0260"
    },
    "areaServed": ["Brisbane", "South East Queensland"],
    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "sales",
      "telephone": "+61 458 533 333",
      "email": "info@amgcube.com",
      "availableLanguage": ["English"]
    },
    "sameAs": []
  }
  </script>

  <!-- Preconnect to third-party origins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://code.jquery.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">

  <!-- Preload key external files -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Montserrat:wght@400;700&family=Droid+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" />
  <link rel="preload" as="script" href="https://code.jquery.com/jquery-3.6.0.min.js" />

  <!-- Custom CSS & Bootstrap Core CSS -->
  <link rel="stylesheet" href="{{ "/style.css" | prepend: site.baseurl }}">

  <!-- Font Awesome (no integrity to prevent blocking) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


  <!-- Google Fonts：Poppins（正文）、Montserrat（标题）、Droid Serif（副标题） -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Montserrat:wght@400;700&family=Droid+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightbox2@2/dist/css/lightbox.min.css">
