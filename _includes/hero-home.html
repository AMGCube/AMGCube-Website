<header class="hero-home">
  <div class="hero-background">
    <div class="hero-grid container" data-hero-carousel data-interval="6000" aria-roledescription="carousel" aria-label="Featured granny flat designs">
      <div class="intro-text">
        <p class="hero-eyebrow">QBCC Licensed Builder</p>
        <h1 class="intro-heading">
          <span class="hero-heading-line">Granny flats,</span>
          <span class="hero-heading-line">built for your block.</span>
        </h1>
        <p class="intro-subtitle">Designed and built across South East Queensland.</p>
      </div>
      <div class="hero-linework">
        <div class="hero-carousel-viewport" aria-live="off">
          {% for slide in site.data.hero_slides %}
            <figure class="hero-carousel-slide{% if slide.crop_scene %} hero-carousel-slide--project-scene{% endif %}{% if forloop.first %} is-active{% endif %}"
                    data-hero-slide
                    aria-hidden="{% if forloop.first %}false{% else %}true{% endif %}">
              {% if slide.crop_scene %}<div class="hero-carousel-image-frame">{% endif %}
              <img src="{{ slide.image }}"
                   alt="{{ slide.alt }}"
                   {% if forloop.first %}loading="eager" fetchpriority="high"{% else %}loading="lazy"{% endif %}>
              {% if slide.crop_scene %}</div>{% endif %}
              <figcaption class="hero-drawing-caption">
                <span>{{ forloop.index | prepend: '0' | slice: -2, 2 }}</span>
                {{ slide.label }}
              </figcaption>
            </figure>
          {% endfor %}
        </div>
      </div>
      {% if site.data.hero_slides.size > 1 %}
        <div class="hero-carousel-controls" aria-label="Choose a Hero image">
          {% for slide in site.data.hero_slides %}
            <button type="button"
                    class="hero-carousel-dot{% if forloop.first %} is-active{% endif %}"
                    data-hero-dot="{{ forloop.index0 }}"
                    aria-label="Show image {{ forloop.index }}"
                    aria-pressed="{% if forloop.first %}true{% else %}false{% endif %}">
              <span></span>
            </button>
          {% endfor %}
        </div>
      {% endif %}
    </div>
  </div>
</header>
