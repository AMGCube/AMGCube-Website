---
layout: page
---

<article class="container">
    <h1>{{ page.title }}</h1>
    <p class="meta">Published on {{ page.date | date: "%B %d, %Y" }}</p>
    <p class="subtitle">{{ page.subtitle }}</p>

    <div class="post-content">
        {{ content }}
    </div>

    <hr>

    <div class="post-footer">
        <p><a href="/news/">Back to News</a></p>
    </div>
</article>
